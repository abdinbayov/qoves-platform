apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-api
  namespace: django-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    # CPU is a proxy signal here — see WRITEUP.md for why request-rate or
    # latency would be the right signal for an I/O-bound API in production.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
